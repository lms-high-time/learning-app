# Прогон серверных тестов приложения. Основан на ci.yml из frappe/lms —
# связка та же, отличается набором приложений и закреплённой ревизией Frappe.
name: Тесты

on:
  push:
    branches: [master]
  pull_request: {}

# Новый коммит в ветку PR останавливает прогон прежнего. Why: итог прежнего
# коммита уже никому не нужен — обязательная проверка смотрит на последний, —
# а его машины задерживают новый. На прежнем коммите остаётся красный итог
# `bench run-tests` — на мерж это не влияет. Пуши в master не отменяются и
# проверяются целиком. Ручной Re-run старого прогона отменит прогон последнего
# коммита — тогда перезапустить последний.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Токен только на чтение. Why: прогону тестов писать некуда — кэш идёт через
# свой токен рантайма, не через GITHUB_TOKEN; явная строка нужна OpenSSF
# Scorecard (Token-Permissions) и не даёт правам расшириться вслед за
# настройкой репозитория.
permissions:
  contents: read

env:
  # Ревизия Frappe образа стенда, двигается вместе с ним. При сдвиге сверить
  # правила обхода тестов в frappe/testing/discovery.py с run_tests_part.py:
  # скрипт их повторяет, и расхождение молча выбросит модули из прогона.
  FRAPPE_REV: c1f1e8ec3708750d7254f7f99d869ffb9886f19f
  # Why: версии закреплены до патча — плавающий тег меняет окружение CI без
  # коммита, а ключ кэша образов по нему не отличил бы одну сборку от другой.
  REDIS_VERSION: 7.4.11-alpine
  MARIADB_VERSION: 11.8.9
  # Зеркало официальных образов Docker Hub в ECR Public.
  IMAGE_MIRROR: public.ecr.aws/docker/library

jobs:
  # Меняет ли PR что-то, кроме документации. Why: PR только с правкой README
  # или правил гонял все тесты впустую. Пропуск — только когда документы из
  # явного списка изменены (`M`): добавление, удаление и переименование гоняют
  # тесты — `README.md` читает `pyproject.toml` при установке приложения, а
  # переименование могло унести файл, который читают тесты. Список явный, а не
  # `*.md`: `CONTRACT.md` читают тесты контракта. Пуш в master гоняет тесты
  # всегда. Любая неоднозначность (сбой `git diff`, пустой список) — тесты идут.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Только документация?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "Пуш в master — тесты идут всегда"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD — merge-коммит PR, его первый родитель — база.
          if ! files=$(git diff --no-renames --name-status HEAD^1 HEAD 2>&1); then
            printf 'git diff не сработал, тесты идут:\n%s\n' "$files"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Изменено:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvxP 'M\t(README\.md|TESTING\.md|CONTRIBUTING\.md|license\.txt)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Тесты делятся на части, каждая поднимает своё окружение на отдельной
  # машине. Why: тесты идут последовательно и занимают бо́льшую часть прогона;
  # на нескольких машинах стена прогона — подготовка плюс доля тестов.
  # fail-fast выключен: упавшая часть не обрывает остальные, и один прогон
  # показывает все падения. Матрица — только `part`: число частей берётся из
  # `strategy.job-total`, и второе измерение молча выбросило бы модули.
  # Скрипт сверяет состав матрицы и падает, если в ней есть что-то ещё.
  tests:
    name: bench run-tests ${{ matrix.part }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Образы redis и MariaDB лежат в кэше GitHub, при промахе скачиваются
      # с зеркала. Why: анонимный pull с Docker Hub упирается в rate limit —
      # прогон падает на старте контейнеров с `toomanyrequests`, не дойдя до
      # тестов. Контейнеры поэтому поднимаются шагами, а не блоком `services:`:
      # он стартует до шагов и кэша не видит. `v1` в ключе — номер схемы кэша:
      # поднимать при смене состава архива.
      # Кэш восстанавливается и сохраняется отдельными шагами. Why: post-шаг
      # `actions/cache` сохраняет только при зелёной job, и на красных тестах
      # каждый следующий прогон снова шёл бы на зеркало.
      - name: Кэш образов сервисов
        id: images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/image-cache
          key: ${{ runner.os }}-images-v1-${{ env.IMAGE_MIRROR }}-redis${{ env.REDIS_VERSION }}-mariadb${{ env.MARIADB_VERSION }}

      # Pull с зеркала — с повтором через паузу. Why: анонимный лимит ECR
      # Public считается в запросах в секунду с IP, а раннеры делят адреса:
      # на промахе кэша pull ловит `toomanyrequests: Rate exceeded`.
      - name: Загрузить образы сервисов
        run: |
          REDIS_IMAGE="$IMAGE_MIRROR/redis:$REDIS_VERSION"
          MARIADB_IMAGE="$IMAGE_MIRROR/mariadb:$MARIADB_VERSION"
          pull() {
            for attempt in 1 2 3 4 5 6; do
              docker pull "$1" && return 0
              [ "$attempt" -lt 6 ] && sleep $((attempt * 5))
            done
            return 1
          }
          if [ -f ~/image-cache/images.tar ]; then
            docker load -i ~/image-cache/images.tar
          else
            pull "$REDIS_IMAGE"
            pull "$MARIADB_IMAGE"
            mkdir -p ~/image-cache
            docker save -o ~/image-cache/images.tar "$REDIS_IMAGE" "$MARIADB_IMAGE"
          fi

      - name: Сохранить образы сервисов в кэш
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/image-cache
          key: ${{ steps.images.outputs.cache-primary-key }}

      # Порты нестандартные не для красоты: bench ожидает redis именно на них,
      # когда конфигурация не генерируется (--skip-redis-config-generation).
      # Контейнеры стартуют до подготовки bench, а готовность MariaDB
      # проверяется перед созданием сайта. Why: инициализация базы идёт
      # параллельно с установкой bench и не стоит в очереди за ней.
      # `--pull=never`: образа нет в архиве — шаг падает, а не скачивает его
      # молча мимо повторов.
      - name: Поднять redis и MariaDB
        run: |
          REDIS_IMAGE="$IMAGE_MIRROR/redis:$REDIS_VERSION"
          MARIADB_IMAGE="$IMAGE_MIRROR/mariadb:$MARIADB_VERSION"
          docker run -d --pull=never --name redis-cache -p 13000:6379 "$REDIS_IMAGE"
          docker run -d --pull=never --name redis-queue -p 11000:6379 "$REDIS_IMAGE"
          docker run -d --pull=never --name redis-socketio -p 12000:6379 "$REDIS_IMAGE"
          docker run -d --pull=never --name mariadb -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=root \
            --health-cmd="healthcheck.sh --connect --innodb_initialized" \
            --health-interval=5s --health-timeout=5s --health-retries=10 \
            "$MARIADB_IMAGE"

      # Строго 3.14: frappe 16 объявляет Python>=3.14,<3.15, и на 3.12
      # установка падает на разрешении зависимостей, а не на тестах.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.14"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Кэш складывается после `bench init` и перехода на ревизию — в нём только Frappe,
      # приложения подключаются следующим шагом и в архив не попадают.
      # Why: поэтому ключ не завязан на источник Learning — смена репозитория
      # или ветки Learning не может достать сборку от прежнего источника.
      # Точная версия Python — в ключе: окружение bench ссылается на
      # интерпретатор раннера по пути с версией, и после обновления раннера
      # до 3.14.8 архив отдавал окружение без Python — `uv` падал на
      # подключении приложений, а не на тестах.
      #
      # Frappe — ровно та ревизия `version-16`, что в образе стенда (полный
      # sha, двигается вместе с ним). Why: вершина ветки уходит вперёд, и CI
      # проверял бы код на другом Frappe, чем работает стенд: 8 октября 2026
      # свежий кэш с вершины ветки уронил тесты навигации desk, которые на
      # ревизии стенда проходят. `v2` в ключе — номер схемы кэша: поднимать
      # при правке шага «Развернуть bench», иначе достанется старый архив.
      - name: Кэш bench
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/bench-cache
          key: ${{ runner.os }}-${{ env.ImageOS }}-bench-v2-${{ env.FRAPPE_REV }}-py${{ steps.python.outputs.python-version }}

      - name: Установить bench
        run: pip3 install frappe-bench

      - name: Развернуть bench с Frappe
        run: |
          if [ -f ~/bench-cache/bench.tgz ]; then
            (cd && tar xzf ~/bench-cache/bench.tgz)
          else
            bench init ~/frappe-bench \
              --frappe-branch version-16 \
              --skip-redis-config-generation \
              --skip-assets \
              --python "$(which python)"
            git -C ~/frappe-bench/apps/frappe fetch --quiet --depth 1 upstream "$FRAPPE_REV"
            git -C ~/frappe-bench/apps/frappe checkout --quiet "$FRAPPE_REV"
            (cd ~/frappe-bench && bench setup requirements)
            mkdir -p ~/bench-cache
            (cd && tar czf ~/bench-cache/bench.tgz frappe-bench)
          fi

      - name: Подключить приложения
        working-directory: /home/runner/frappe-bench
        run: |
          # payments — не наша прихоть: lms объявляет его в required_apps
          # и без него не устанавливается.
          # --skip-assets: тесты серверные, собранный фронтенд им не нужен.
          bench get-app --skip-assets --branch version-16 https://github.com/frappe/payments
          # Learning — из нашего форка, той же веткой, что стоит на стенде
          # платформы. Why: на upstream `main` тесты шли бы по другой схеме
          # Learning, чем работает стенд, — права, DocType и хуки расходятся
          # с первой же серверной правкой форка или отставанием от upstream.
          #
          # Ставится клоном и `uv pip`, без `bench get-app`. Why: get-app
          # всегда запускает `yarn install` корня и `frontend/` Learning — это
          # почти минута из шага, а серверным тестам `node_modules` не нужны:
          # ассеты не собираются. Каталог — `apps/lms`, по имени приложения.
          # `apps.txt` пересобирает get-app нашего приложения по каталогам
          # `apps/`, поэтому клон обязан стоять до него.
          git clone --quiet --depth 1 --branch high-time https://github.com/lms-high-time/learning-fork apps/lms
          uv pip install --quiet -e apps/lms --python env/bin/python
          bench get-app lms_frappe_app "$GITHUB_WORKSPACE"

      - name: Дождаться MariaDB
        run: |
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mariadb || echo missing)
            case "$status" in
              healthy) exit 0 ;;
              unhealthy | missing) break ;;
            esac
            sleep 2
          done
          echo "::error::MariaDB не готова: $status"
          docker logs mariadb || true
          exit 1

      - name: Создать сайт и установить приложения
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --mariadb-user-host-login-scope='%' \
            --db-root-username root --db-root-password root \
            --admin-password admin test.local
          bench --site test.local install-app lms
          bench --site test.local install-app lms_frappe_app
          bench setup requirements --dev
          bench --site test.local set-config allow_tests true
          # Тесты заводят учеников и кураторов сотнями за прогон, а Frappe
          # отказывает в создании пользователя сверх 60 за час («Throttled»).
          # Лимит — защита живого сайта от регистрационного спама, тестовому
          # сайту она только роняет прогон (learning-services#383).
          bench --site test.local set-config --parse throttle_user_limit 100000

      # Раскладка модулей по частям и почему не `run-parallel-tests` —
      # в docstring скрипта.
      - name: Прогнать тесты
        working-directory: /home/runner/frappe-bench/sites
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: >-
          /home/runner/frappe-bench/env/bin/python "$GITHUB_WORKSPACE/.github/scripts/run_tests_part.py"
          test.local lms_frappe_app ${{ matrix.part }} ${{ strategy.job-total }}

      # Логи сервисов при падении. Why: блок `services:` печатал их сам, а
      # падение теста из-за базы без лога MariaDB не разобрать.
      - name: Логи сервисов
        if: failure()
        run: |
          for c in mariadb redis-cache redis-queue redis-socketio; do
            echo "::group::$c"
            docker logs "$c" || true
            echo "::endgroup::"
          done

  # Итог частей под именем обязательной проверки ветки master. Why: правило
  # защиты ветки требует проверку `bench run-tests`, а у частей матрицы имена
  # свои. Без `always()` при падении части итог был бы skipped, а skipped
  # обязательная проверка не блокирует мерж. Части пропущены — зелёный итог,
  # только если коммит меняет одну документацию и это определено без ошибки.
  tests-result:
    name: bench run-tests
    needs: [changes, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Все части зелёные или менялась только документация
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TESTS: ${{ needs.tests.result }}
        run: |
          test "$CHANGES" = success
          if [ "$CODE" = false ]; then
            test "$TESTS" = skipped
          else
            test "$TESTS" = success
          fi
