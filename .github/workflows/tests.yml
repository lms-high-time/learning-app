# Прогон серверных тестов приложения. Основан на ci.yml из frappe/lms —
# связка та же, отличается набором приложений и веткой Frappe.
name: Тесты

on:
  push:
    branches: [master]
  pull_request: {}

env:
  # Ревизия Frappe образа стенда, двигается вместе с ним.
  FRAPPE_REV: c1f1e8ec3708750d7254f7f99d869ffb9886f19f

jobs:
  tests:
    name: bench run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Порты нестандартные не для красоты: bench ожидает redis именно на них,
      # когда конфигурация не генерируется (--skip-redis-config-generation).
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      redis-socketio:
        image: redis:alpine
        ports: ["12000:6379"]
      mariadb:
        image: mariadb:11.8
        ports: ["3306:3306"]
        env:
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v5

      # Строго 3.14: frappe 16.32.0 объявляет Python>=3.14,<3.15, и на 3.12
      # установка падает на разрешении зависимостей, а не на тестах.
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Кэш складывается сразу после `bench init` — в нём только Frappe,
      # приложения подключаются следующим шагом и в архив не попадают.
      # Why: поэтому ключ не завязан на источник Learning — смена репозитория
      # или ветки Learning не может достать сборку от прежнего источника.
      # Точная версия Python — в ключе: окружение bench ссылается на
      # интерпретатор раннера по пути с версией, и после обновления раннера
      # до 3.14.8 архив отдавал окружение без Python — `uv` падал на
      # подключении приложений, а не на тестах.
      #
      # Frappe — ровно та ревизия `version-16`, что в образе стенда (полный
      # sha, двигается вместе с ним). Why: вершина ветки уходит вперёд, и CI
      # проверял бы код на другом Frappe, чем работает стенд: 8 октября 2026
      # свежий кэш с вершины ветки уронил тесты навигации desk, которые на
      # ревизии стенда проходят.
      - name: Кэш bench
        uses: actions/cache@v4
        with:
          path: ~/bench-cache
          key: ${{ runner.os }}-bench-${{ env.FRAPPE_REV }}-py${{ steps.python.outputs.python-version }}

      - name: Установить bench
        run: pip3 install frappe-bench

      - name: Развернуть bench с Frappe
        run: |
          if [ -f ~/bench-cache/bench.tgz ]; then
            (cd && tar xzf ~/bench-cache/bench.tgz)
          else
            bench init ~/frappe-bench \
              --frappe-branch version-16 \
              --skip-redis-config-generation \
              --skip-assets \
              --python "$(which python)"
            git -C ~/frappe-bench/apps/frappe fetch --quiet --depth 1 upstream "$FRAPPE_REV"
            git -C ~/frappe-bench/apps/frappe checkout --quiet "$FRAPPE_REV"
            (cd ~/frappe-bench && bench setup requirements --python)
            mkdir -p ~/bench-cache
            (cd && tar czf ~/bench-cache/bench.tgz frappe-bench)
          fi

      - name: Подключить приложения
        working-directory: /home/runner/frappe-bench
        run: |
          # payments — не наша прихоть: lms объявляет его в required_apps
          # и без него не устанавливается.
          bench get-app --branch version-16 https://github.com/frappe/payments
          # Learning — из нашего форка, той же веткой, что стоит на стенде
          # платформы. Why: на upstream `main` тесты шли бы по другой схеме
          # Learning, чем работает стенд, — права, DocType и хуки расходятся
          # с первой же серверной правкой форка или отставанием от upstream.
          bench get-app --branch high-time https://github.com/lms-high-time/learning-fork
          bench get-app lms_frappe_app "$GITHUB_WORKSPACE"

      - name: Создать сайт и установить приложения
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --mariadb-user-host-login-scope='%' \
            --db-root-username root --db-root-password root \
            --admin-password admin test.local
          bench --site test.local install-app lms
          bench --site test.local install-app lms_frappe_app
          bench setup requirements --dev
          bench --site test.local set-config allow_tests true
          # Тесты заводят учеников и кураторов сотнями за прогон, а Frappe
          # отказывает в создании пользователя сверх 60 за час («Throttled»).
          # Лимит — защита живого сайта от регистрационного спама, тестовому
          # сайту она только роняет прогон (learning-services#383).
          bench --site test.local set-config --parse throttle_user_limit 100000

      - name: Прогнать тесты
        working-directory: /home/runner/frappe-bench
        run: bench --site test.local run-tests --app lms_frappe_app
